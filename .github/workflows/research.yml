name: Portfolio research CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Test all strategies
        run: pytest -q

  real-data-research:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e .
      - name: Download real daily ETF prices
        run: python scripts/download_data.py
      - name: Run walk-forward analysis
        run: python scripts/run_research.py
      - name: Upload reproducible figures and metrics
        uses: actions/upload-artifact@v4
        with:
          name: real-etf-portfolio-results
          path: |
            figures/*.png
            reports/*.csv
          if-no-files-found: error
